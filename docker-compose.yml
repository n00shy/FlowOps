services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: dataflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: dataflow
    volumes:
      - mongo_data:/data/db
    networks:
      - dataflow-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    image: n00shy/dataflow-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dataflow-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/dataflow
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - dataflow-net
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: n00shy/dataflow-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dataflow-net
    ports:
      - "3005:80"

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: dataflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - dataflow-net

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: dataflow-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - dataflow-net

volumes:
  mongo_data:
    driver: local

networks:
  dataflow-net:
    driver: bridge
